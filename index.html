<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Load Balancer Exercise</title>
    <script>
        async function send_request() {
            try {
                const response = await fetch('/request', { method: 'GET' });
                const data = await response.json();
                document.getElementById("response_area").textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById("response_area").textContent = `Error: ${error.message}`;
            }
        }

        async function stop() {
            try {
                const response = await fetch('/stop', { method: 'POST' });
                const data = await response.json();
                document.getElementById("response_area").textContent = data.message;
            } catch (error) {
                document.getElementById("response_area").textContent = `Error: ${error.message}`;
            }
        }
    </script>
</head>
<body>
    <button onclick="send_request()">REQUEST</button>
    <button onclick="stop()">STOP</button>
    <pre id="response_area"></pre>
</body>
</html>
