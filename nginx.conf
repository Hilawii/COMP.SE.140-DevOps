events {}

http {
    upstream cluster {
        server service1:8199;
        server service1:8199;
        server service1:8199;
    }

    server {
        listen 8187;
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /usr/share/nginx/html;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        location /request {
            proxy_pass http://cluster/;
        }
    }
}
